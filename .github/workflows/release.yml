name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docky-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: macos-26-intel
    outputs:
      release_tag: ${{ steps.preflight.outputs.release_tag }}
      marketing_version: ${{ steps.preflight.outputs.marketing_version }}
      build_version: ${{ steps.preflight.outputs.build_version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch main ancestry reference
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Validate tag, release state, and build sequence
        id: preflight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          RELEASE_TAG="$REQUESTED_TAG"
          BUILD_VERSION="$(date -u +%Y%m%d%H%M)"
          export RELEASE_TAG BUILD_VERSION
          python3 scripts/release_preflight.py

  build-and-sign:
    needs: preflight
    runs-on: macos-26-intel
    environment: release
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      MARKETING_VERSION: ${{ needs.preflight.outputs.marketing_version }}
      BUILD_VERSION: ${{ needs.preflight.outputs.build_version }}
      NOTARYTOOL_PROFILE: DockyReleaseNotary
    steps:
      - name: Configure runner paths
        run: printf 'RELEASE_KEYCHAIN=%s\n' "$RUNNER_TEMP/DockyRelease.keychain-db" >> "$GITHUB_ENV"

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read checked-in Sparkle public key
        id: sparkle
        run: |
          public_key="$(tr -d '[:space:]' < Config/SparklePublicKey.txt)"
          test -n "$public_key"
          echo "public_key=$public_key" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate and notary profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/DockyRelease.p12"
          password_path="$RUNNER_TEMP/DockyRelease.keychain-password"
          umask 077
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          openssl rand -base64 32 > "$password_path"
          keychain_password="$(cat "$password_path")"
          security create-keychain -p "$keychain_password" "$RELEASE_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$RELEASE_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$RELEASE_KEYCHAIN"
          security import "$certificate_path" -k "$RELEASE_KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$RELEASE_KEYCHAIN"

          identity_count=0
          while IFS= read -r identity; do
            if [[ "$identity" == *"Developer ID Application:"*"($APPLE_TEAM_ID)"* ]]; then
              identity_count=$((identity_count + 1))
            fi
          done <<< "$(security find-identity -v -p codesigning "$RELEASE_KEYCHAIN")"
          test "$identity_count" -eq 1

          xcrun notarytool store-credentials "$NOTARYTOOL_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$RELEASE_KEYCHAIN"
          rm -f "$certificate_path"

      - name: Build, sign, notarize, and staple
        id: build
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PUBLIC_KEY: ${{ steps.sparkle.outputs.public_key }}
        run: scripts/release_sparkle_update.sh

      - name: Verify signed app and embedded Watchdog
        env:
          APP_PATH: ${{ steps.build.outputs.app_path }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PUBLIC_KEY: ${{ steps.sparkle.outputs.public_key }}
        run: scripts/verify_release_bundle.sh

      - name: Sign and verify appcast
        id: appcast
        env:
          RELEASE_ZIP: ${{ steps.build.outputs.release_zip }}
          SPARKLE_BIN_DIR: ${{ github.workspace }}/build/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY_FILE: ${{ github.workspace }}/Config/SparklePublicKey.txt
          APPCAST_OUTPUT_DIR: ${{ github.workspace }}/build/updates
        run: scripts/sign_release_appcast.sh

      - name: Recheck immutable appcast metadata
        run: |
          python3 scripts/verify_release_artifacts.py \
            --release-tag "$RELEASE_TAG" \
            --marketing-version "$MARKETING_VERSION" \
            --build-version "$BUILD_VERSION" \
            --archive "${{ steps.build.outputs.release_zip }}" \
            --appcast "${{ steps.appcast.outputs.appcast }}"

      - name: Stage release artifacts
        run: |
          mkdir -p build/publication
          cp "${{ steps.build.outputs.release_zip }}" build/publication/
          cp "${{ steps.appcast.outputs.appcast }}" build/publication/appcast.xml

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docky-release-${{ needs.preflight.outputs.release_tag }}
          path: build/publication/*
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RELEASE_KEYCHAIN" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/DockyRelease.p12" "$RUNNER_TEMP/DockyRelease.keychain-password"

  publish:
    needs: [preflight, build-and-sign]
    runs-on: macos-26-intel
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: docky-release-${{ needs.preflight.outputs.release_tag }}
          path: artifacts

      - name: Create draft, upload assets, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          MARKETING_VERSION: ${{ needs.preflight.outputs.marketing_version }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release already exists for $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" artifacts/* \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "Docky $MARKETING_VERSION"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest

      - name: Delete unpublished draft after publication failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)" == "true" ]]; then
            gh release delete "$RELEASE_TAG" --yes
          fi
